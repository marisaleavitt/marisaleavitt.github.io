<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marisa Cohn</title>

<style>

/* =====================================================
   HOMEPAGE

   Designed as a simple front door.

   Intentionally sparse:
   - navigation
   - name
   - one image

   Nothing else.

===================================================== */


/* =====================================================
   FONTS

   Avenir for navigation.

   KaTeX_Main has a slightly mathematical /
   editorial quality reminiscent of Euler.

===================================================== */

@import url('https://fonts.cdnfonts.com/css/avenir');

@import url('https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css');


/* =====================================================
   VARIABLES

===================================================== */

:root {

    --bg: #f7f4ee;

    --text: #111111;

    --muted: #777777;

    --heading: "KaTeX_Main", serif;

    --body: "Avenir", sans-serif;
}


/* =====================================================
   RESET

===================================================== */

* {

    margin: 0;

    padding: 0;

    box-sizing: border-box;
}


/* =====================================================
   BODY

===================================================== */

body {

    background: var(--bg);

    color: var(--text);

    font-family: var(--body);

    max-width: 1600px;

    margin: auto;

    padding: 3rem;
}


/* =====================================================
   NAVIGATION

   Quiet and unobtrusive.

===================================================== */

nav {

    display: flex;

    gap: 2rem;

    font-size: .8rem;

    text-transform: uppercase;

    letter-spacing: .15em;

    margin-bottom: 8rem;
}


nav a {

    text-decoration: none;

    color: inherit;

    transition: opacity .2s ease;
}


nav a:hover {

    opacity: .5;
}


/* =====================================================
   HOMEPAGE LAYOUT

   Large vertical spacing creates a feeling
   similar to a publication cover page.

===================================================== */

main {

    display: flex;

    flex-direction: column;

    gap: 5rem;
}


/* =====================================================
   NAME

   Kept fairly restrained.

===================================================== */

h1 {

    font-family: var(--heading);

    font-weight: normal;

    font-size: clamp(2.5rem, 5vw, 4.5rem);

    line-height: .95;
}


/* =====================================================
   HERO IMAGE

===================================================== */

.hero-image {

    width: 100%;

    max-width: 1200px;

    display: block;
}


/* =====================================================
   MOBILE

===================================================== */

@media (max-width: 800px) {

    body {

        padding: 1.5rem;
    }

    nav {

        gap: 1rem;

        flex-wrap: wrap;
    }

    main {

        gap: 3rem;
    }

    h1 {

        font-size: 2.2rem;
    }
}

</style>

</head>

<body>


    <!-- =====================================
         NAVIGATION
    ====================================== -->

    <nav>

        <a href="research.html">Research</a>

        <a href="writing.html">Writing</a>

        <a href="students.html">Students</a>

        <a href="about.html">About</a>

    </nav>



    <!-- =====================================
         HOMEPAGE
    ====================================== -->

    <main>

        <h1>Marisa Leavitt Cohn</h1>

        <img
            class="hero-image"
            src="images/marisa/home-image.jpg"
            alt="Selected image from Marisa Cohn's research and design practice">

    </main>


</body>

</html>
