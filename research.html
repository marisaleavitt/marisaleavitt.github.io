<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Research | Marisa Cohn</title>

<link rel="stylesheet" href="css/style.css">

<style>

/* ============================================
   RESEARCH PAGE SPECIFIC STYLES
============================================ */

.research-title {

    font-size: .85rem;

    text-transform: uppercase;

    letter-spacing: .15em;

    margin-bottom: 3rem;
}


/* Masonry-style archive */

.research-grid {

    columns: 4 280px;

    column-gap: 2rem;
}


/* Individual image link */

.research-item {

    display: block;

    position: relative;

    margin-bottom: 2rem;

    text-decoration: none;

    color: inherit;

    break-inside: avoid;
}


/* Images */

.research-item img {

    width: 100%;

    display: block;

    transition:
        transform .3s ease,
        opacity .3s ease;

    filter:
        saturate(.9)
        contrast(.95);
}


/* Hover effect */

.research-item:hover img {

    transform: scale(1.01);

    opacity: .92;
}


/* Hover label */

.research-item span {

    position: absolute;

    left: 1rem;

    bottom: 1rem;

    background: rgba(247,244,238,.95);

    font-size: .8rem;

    padding: .4rem .7rem;

    letter-spacing: .1em;

    text-transform: uppercase;

    opacity: 0;

    transition: opacity .25s ease;
}

.research-item:hover span {

    opacity: 1;
}


/* Optional archival offsets */

.offset {

    margin-top: -3rem;
}

.offset-large {

    margin-top: -6rem;
}


/* Mobile */

@media (max-width: 900px) {

    .research-grid {

        columns: 2 200px;
    }

    .offset,
    .offset-large {

        margin-top: 0;
    }

}

@media (max-width: 600px) {

    .research-grid {

        columns: 1;
    }

    .research-item span {

        opacity: 1;

        position: static;

        display: inline-block;

        margin-top: .5rem;
    }

}

</style>

</head>

<body>

<nav>

    <a href="index.html">Home</a>

    <a href="research.html">Research</a>

    <a href="writing.html">Writing</a>

    <a href="students.html">Students</a>

    <a href="about.html">About</a>

</nav>

<h1 class="research-title">
    Research
</h1>

<section
    class="research-grid"
    id="research-grid">

</section>


<!-- Data -->

<script src="js/research-data.js"></script>


<!-- Page Builder -->

<script>

const grid =
document.getElementById("research-grid");


researchImages.forEach(item => {

    const link =
    document.createElement("a");

    link.href =
    "research/" + item.page + ".html";

    link.className =
    "research-item " + (item.layout || "");

    link.innerHTML = `

        <img
            src="${item.src}"
            alt="${item.title}">

        <span>${item.title}</span>

    `;

    grid.appendChild(link);

});

</script>

</body>

</html>
