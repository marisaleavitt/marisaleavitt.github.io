<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Research | Marisa Cohn</title>

<link rel="stylesheet" href="css/style.css">

<style>

/* ============================================
   RESEARCH ATLAS

   Images are the navigation.

   The page is generated automatically from
   data/images.js.

============================================ */

.research-title {

    font-size: .85rem;

    text-transform: uppercase;

    letter-spacing: .15em;

    margin-bottom: 3rem;
}


/* -----------------------------------------
   MASONRY LAYOUT
----------------------------------------- */

.research-grid {

    columns: 4 280px;

    column-gap: 2rem;
}


/* -----------------------------------------
   INDIVIDUAL IMAGE
----------------------------------------- */

.research-item {

    display: block;

    position: relative;

    break-inside: avoid;

    margin-bottom: 2rem;

    text-decoration: none;

    color: inherit;
}


/* -----------------------------------------
   IMAGE
----------------------------------------- */

.research-item img {

    width: 100%;

    display: block;

    filter:
        saturate(.9)
        contrast(.95);

    transition:
        transform .3s ease,
        opacity .3s ease;
}


/* -----------------------------------------
   HOVER EFFECT
----------------------------------------- */

.research-item:hover img {

    transform: scale(1.01);

    opacity: .92;
}


/* -----------------------------------------
   LABEL
----------------------------------------- */

.research-item span {

    position: absolute;

    left: 1rem;

    bottom: 1rem;

    background: rgba(247,244,238,.95);

    padding: .45rem .7rem;

    font-size: .8rem;

    letter-spacing: .1em;

    text-transform: uppercase;

    opacity: 0;

    transition: opacity .25s ease;
}

.research-item:hover span {

    opacity: 1;
}


/* -----------------------------------------
   OPTIONAL OFFSETS
----------------------------------------- */

.offset {

    margin-top: -3rem;
}

.offset-large {

    margin-top: -6rem;
}


/* -----------------------------------------
   MOBILE
----------------------------------------- */

@media (max-width: 900px) {

    .research-grid {

        columns: 2 200px;
    }

    .offset,
    .offset-large {

        margin-top: 0;
    }
}

@media (max-width: 600px) {

    .research-grid {

        columns: 1;
    }

    .research-item span {

        opacity: 1;

        position: static;

        display: inline-block;

        margin-top: .5rem;
    }
}

</style>

</head>

<body>

<nav>

    <a href="index.html">Home</a>

    <a href="research.html">Research</a>

    <a href="writing.html">Writing</a>

    <a href="students.html">Students</a>

    <a href="about.html">About</a>

</nav>


<h1 class="research-title">
    Research
</h1>


<!-- ==================================
     GENERATED IMAGE ATLAS
=================================== -->

<section
    id="research-grid"
    class="research-grid">

</section>


<!-- ==================================
     LOAD IMAGE DATA
=================================== -->

<script src="data/images.js"></script>


<!-- ==================================
     BUILD PAGE
=================================== -->

<script>

const grid =
document.getElementById("research-grid");


researchImages.forEach(item => {

    const card =
    document.createElement("a");

    card.href =
        "research/" + item.page + ".html";

    card.className =
        "research-item " + (item.layout || "");

    card.innerHTML = `

        <img
            src="${item.src}"
            alt="${item.title}">

        <span>${item.title}</span>

    `;

    grid.appendChild(card);

});

</script>

</body>

</html>
